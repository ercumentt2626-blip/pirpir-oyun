rue);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function strike(){attackTime=.4;let hit=false;for(const m of mobs){if(!m.alive)continue;const distance=m.g.position.distanceTo(hero.position);if(distance<3.1){m.hp--;hit=true;m.g.scale.setScalar(m.hp===1?0.86:1);if(m.hp<=0){m.alive=false;scene.remove(m.g);kills++;dropCoin(m.g.position.x,m.g.position.z)}break}}updateHud()}document.querySelector('#attack').addEventListener('pointerdown',e=>{e.preventDefault();strike()});const stage=document.querySelector('#stage');let cameraPointer=null,lastX=0,lastY=0,orbitAngle=.61,orbitPitch=.48;stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(cameraPointer!==null)return;e.preventDefault();cameraPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(e.pointerId!==cameraPointer)return;e.preventDefault();const mx=e.clientX-lastX,my=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;orbitAngle-=mx*.008;orbitPitch=THREE.MathUtils.clamp(orbitPitch+my*.004,.18,1.05)});function endOrbit(e){if(e.pointerId===cameraPointer)cameraPointer=null}for(const ev of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(ev,endOrbit);const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);elapsed+=dt;const dx=axis.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=axis.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dz);if(len>.1){const vx=dx/len,vz=dz/len;const worldX=vx*Math.cos(orbitAngle)+vz*Math.sin(orbitAngle),worldZ=-vx*Math.sin(orbitAngle)+vz*Math.cos(orbitAngle);hero.position.x=THREE.MathUtils.clamp(hero.position.x+worldX*dt*4,-38,38);hero.position.z=THREE.MathUtils.clamp(hero.position.z+worldZ*dt*4,-38,38);hero.rotation.y=Math.atan2(-worldX,-worldZ);const walk=Math.sin(elapsed*12)*.65;legs[0].rotation.x=walk;legs[1].rotation.x=-walk;arms[0].rota
